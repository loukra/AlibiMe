name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: cp .env.example .env
      - name: Tests
        run: python -m pytest
      - name: Agent evals (offline)
        run: python -m evals.run

  app:
    runs-on: macos-26
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test
      - name: German translations complete
        run: scripts/strings.sh --check
