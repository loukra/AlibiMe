# nginx in front of the AlibiMe API. Goes to /etc/nginx/sites-available/alibime,
# linked from sites-enabled/. certbot --nginx -d api.alibime.example adds TLS.
# Replace api.alibime.example with the real API domain (DNS A/AAAA record to
# this server first, or certbot fails).
#
# The app, Vapi, Twilio and Apple only ever talk to it over HTTPS.

# Access log with a shortened client address. Request
# bodies (phone numbers, transcripts) are never logged; URLs carry no personal
# data.
map $remote_addr $alibime_short_ip {
    ~^(?<v4>\d+\.\d+\.\d+)\.\d+$                   $v4.0;
    ~^(?<v6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):  $v6::;
    default                                        0.0.0.0;
}

log_format alibime_short '$alibime_short_ip [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name api.alibime.example;

    access_log /var/log/nginx/alibime.access.log alibime_short;
    error_log  /var/log/nginx/alibime.error.log;

    # JSON and webhook bodies are small; App Store notifications are the
    # largest, a few KB.
    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
